name: Update polls

# Runs every hour, or on demand: Actions tab -> "Update polls" -> "Run workflow".
# Reads every race article on Wikipedia, merges new poll rows into
# data/polls.js and data/polls.json, and commits them when polls changed.
# Scheduled runs use the default branch. To pause them, comment out "schedule".
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would change without committing
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-polls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        run: node --test test/*.test.js

      - name: Pull polls from Wikipedia
        run: node scripts/update-polls.js ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Re-run tests on the refreshed data
        if: ${{ !inputs.dry_run }}
        run: node --test test/*.test.js

      - name: Print the new forecast
        run: node scripts/predict.js

      - name: Commit refreshed data
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- data; then
            echo "No poll changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polls.js data/polls.json
          git commit -m "Update polls from Wikipedia"
          git pull --rebase
          git push
